{% extends 'partials/admin/body_login.html' %}
{% load bootstrap_icons %}
{% block contenido %}
<div class="login-box">
    <div class="card card-outline card-primary">
      <div class="card-header text-center">
        <a href="{% url 'index-admin' %}" class="h1"><b>In Out</b>Manager</a>
      </div>
      <div class="card-body">
        <p class="login-box-msg">Digita el email que ingresaste en el registro.</p>
        <form method="POST">
          {% csrf_token %}
          <div class="input-group mb-3">
            {{form.email}}
            <div class="input-group-append">
              <div class="input-group-text">
                <span>{% bs_icon 'envelope' %}</span>
              </div>
            </div>
          </div>
          
          <div class="row">
            <div class="col-12">
              <input type="submit" class="btn btn-primary btn-block" value="Enviar">
            </div>
            <!-- /.col -->
          </div>
        </form>
  
        <p class="mt-3 mb-1">
          <a href="{% url 'login' %}">Volver al Login</a>
        </p>
      </div>
      <!-- /.login-card-body -->
    </div>
  </div>
  <!-- /.login-box -->
{% endblock contenido %}
